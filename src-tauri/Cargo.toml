[package]
name = "json-gantt"
version = "0.1.0"
description = "JSON-based Gantt chart editor"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "json_gantt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-store = "2.5.0"
jsonschema = { version = "0.59", default-features = false }
notify = "8.2.0"
svg2pdf = "0.13.0"
thiserror = "2.0.21"
pdf-writer = "0.12"
notify-debouncer-mini = "0.7.0"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
tempfile = "3.27.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
